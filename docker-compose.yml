services:
  cmr-ris-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmr_ris_intelligence
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
